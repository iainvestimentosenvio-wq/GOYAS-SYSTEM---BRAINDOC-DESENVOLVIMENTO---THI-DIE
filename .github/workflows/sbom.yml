name: Generate SBOM

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate SBOM
        run: bash INSTALADOR/comum/scripts/generate-sbom.sh

      - name: Validate SBOM
        run: bash INSTALADOR/comum/scripts/validate-sbom.sh

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: INSTALADOR/saida/sbom/*
